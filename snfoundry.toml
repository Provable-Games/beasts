# Account/signing config is deliberately absent: the deploy script passes --keystore and
# --account (a starkli JSON account file) on the command line. Setting accounts-file here
# makes sncast resolve --account as a NAME inside that file instead of as a path, which
# fails at transaction time with 'Network ... does not exist in accounts file'.
[sncast.default]
url = "$RPC_URL"
wait-params = { timeout = 300, retry-interval = 5 }

[sncast.sepolia]
url = "$SEPOLIA_RPC_URL"
wait-params = { timeout = 300, retry-interval = 5 }
block-explorer = "Voyager"
show-explorer-links = true

[sncast.mainnet]
url = "$MAINNET_RPC_URL"
wait-params = { timeout = 300, retry-interval = 5 }
block-explorer = "Voyager"
show-explorer-links = true
